[package]
name = "nucklavee"
version = "0.1.0"
edition = "2024"
description = "Universal document transformation library (scaffold)"
license = "MIT"

[lib]
name = "nucklavee"
path = "src/lib.rs"

[[bin]]
name = "nucklavee"
path = "src/cli/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
scraper = { version = "0.27.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset"] }
