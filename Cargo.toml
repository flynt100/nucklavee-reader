[package]
name = "nucklavee"
version = "0.1.0"
edition = "2024"
description = "Provenance-rich document transformation and semantic retrieval for Markdown and HTML"
license = "MIT"
repository = "https://github.com/flynt100/nucklavee-reader"
homepage = "https://github.com/flynt100/nucklavee-reader"
readme = "README.md"
keywords = ["documents", "markdown", "rag", "search", "retrieval"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "nucklavee"
path = "src/lib.rs"

[[bin]]
name = "nucklavee"
path = "src/cli/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
scraper = { version = "0.27.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset"] }
encoding_rs = "0.8"
serde_json = "1.0.150"
rusqlite = { version = "0.32", features = ["bundled"] }
usearch = "2.25.3"
tiktoken-rs = "0.12.0"
toml = "1.1.2"

[features]
default = []
# Deterministic fakes (Noop/Hash embedders, no-op index) for testing
# integrations. Not part of the production API surface.
test-support = []

[dev-dependencies]
serde_json = "1.0.150"
# Self dev-dependency: enables test-support for this crate's own tests
# without shipping it in default builds.
nucklavee = { path = ".", features = ["test-support"] }
# Tests craft legacy (pre-v3) databases directly to prove fail-closed
# migration behavior.
rusqlite = { version = "0.32", features = ["bundled"] }
